[workspace]
resolver = "3"
members = [
    "crates/lib-unknown-seed",
    "crates/lib-unknown-lazy",
    "crates/lib-unknown-polymorphism",
    "crates/lib-unknown-errors",
    "crates/lib-unknown-hide",
    "crates/lib-unknown-crypto",
    "crates/lib-unknown-rand",
    "crates/lib-unknown-types",
    "crates/lib-unknown-sys",
    "crates/lib-unknown-hash",
    "crates/lib-unknown-encoding",
    "crates/lib-unknown-compiletest",
    "crates/lib-unknown",
]

[workspace.package]
version = "0.6.0-rc1"
edition = "2024"
rust-version = "1.92"
authors = ["AlbusPhos <owo.zzz@proton.me>"]
license = "MPL-2.0"
repository = "https://github.com/AlbusPhos/lib-unknown"
homepage = "https://github.com/AlbusPhos"

[workspace.dependencies]
lib-unknown-seed = { path = "crates/lib-unknown-seed", version = "0.6.0-rc1", default-features = false }
lib-unknown-lazy = { path = "crates/lib-unknown-lazy", version = "0.6.0-rc1", default-features = false }
lib-unknown-polymorphism = { path = "crates/lib-unknown-polymorphism", version = "0.6.0-rc1", default-features = false }
lib-unknown-errors = { path = "crates/lib-unknown-errors", version = "0.6.0-rc1", default-features = false }
lib-unknown-hide = { path = "crates/lib-unknown-hide", version = "0.6.0-rc1", default-features = false }
lib-unknown-crypto = { path = "crates/lib-unknown-crypto", version = "0.6.0-rc1", default-features = false }
lib-unknown-rand = { path = "crates/lib-unknown-rand", version = "0.6.0-rc1", default-features = false }
lib-unknown-types = { path = "crates/lib-unknown-types", version = "0.6.0-rc1", default-features = false }
lib-unknown-sys = { path = "crates/lib-unknown-sys", version = "0.6.0-rc1", default-features = false }
lib-unknown-hash = { path = "crates/lib-unknown-hash", version = "0.6.0-rc1", default-features = false }
lib-unknown-encoding = { path = "crates/lib-unknown-encoding", version = "0.6.0-rc1", default-features = false }
lib-unknown-compiletest = { path = "crates/lib-unknown-compiletest", version = "0.6.0-rc1", default-features = false }

wasm-bindgen = { version = "0.2", default-features = false }
wasi = { version = "0.14", default-features = false }
