name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches workspace and internal dependency versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG workspace=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG != workspace version $VER"
            exit 1
          fi
          if ! grep -q '^version\.workspace = true$' crates/lib-unknown/Cargo.toml; then
            echo "::error::Facade version should inherit workspace.package.version"
            exit 1
          fi
          # 校验 [workspace.dependencies] 中所有 lib-unknown-* 的版本是否与 workspace 版本一致
          MISMATCH=$(grep -E '^lib-unknown(-[a-z0-9]+)? *= *\{.*version *=' Cargo.toml | grep -v "version = \"$VER\"" || true)
          if [ -n "$MISMATCH" ]; then
            echo "::error::Internal workspace.dependencies version mismatch with $VER:"
            echo "$MISMATCH"
            exit 1
          fi

  test-and-check:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Feature combinations check (cargo-hack)
        run: |
          set -euo pipefail
          cargo hack --workspace clippy --each-feature --locked -- -D warnings
          cargo hack -p lib-unknown check --feature-powerset --depth 2 --locked \
            --skip default,rand,rand-default,sys,types,crypto,hash,encoding,compiletest
      - name: Test (workspace all-features & facade default)
        run: |
          cargo test --workspace --all-features --locked
          cargo test -p lib-unknown --locked
      - name: Doc build (deny warnings)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package & verify workspace (dry-run)
        run: cargo publish --workspace --dry-run --locked

  publish-crates:
    needs: test-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish workspace crates
        run: cargo publish --workspace --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  create-release:
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]:/ || /^---[[:space:]]*$/) { exit }
            found { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
              for (i = start; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Using CHANGELOG entry for $VERSION"
          else
            echo "::warning::CHANGELOG.md has no entry for $VERSION, falling back to Full Changelog"
            if [ -n "$PREV_TAG" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV_TAG" "$GITHUB_REF_NAME" > release-notes.md
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
            fi
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}