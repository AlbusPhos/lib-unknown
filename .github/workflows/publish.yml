name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches workspace version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG workspace=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG != workspace version $VER"
            exit 1
          fi
          if ! grep -q '^version\.workspace = true$' crates/lib-unknown/Cargo.toml; then
            echo "::error::Facade version should inherit workspace.package.version"
            exit 1
          fi

  test-and-check:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Feature combinations check (cargo-hack)
        run: |
          set -euo pipefail
          for pkg in lib-unknown-polymorphism lib-unknown-seed lib-unknown-lazy \
                     lib-unknown-errors lib-unknown-hide \
                     lib-unknown-crypto lib-unknown-rand lib-unknown-types \
                     lib-unknown-sys lib-unknown-hash lib-unknown-encoding \
                     lib-unknown-compiletest lib-unknown; do
            cargo hack -p "$pkg" clippy --each-feature --locked -- -D warnings
          done
          cargo hack -p lib-unknown check --feature-powerset --depth 2 --locked \
            --skip default,rand,rand-default,sys,types,crypto,hash,encoding,compiletest

      - name: Test (workspace all-features & facade default)
        run: |
          cargo test --workspace --all-features --locked
          cargo test -p lib-unknown --locked

      - name: Doc build (deny warnings)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package check
        run: |
          set -euo pipefail
          for pkg in lib-unknown-polymorphism lib-unknown-seed lib-unknown-lazy \
                     lib-unknown-errors lib-unknown-hide \
                     lib-unknown-crypto lib-unknown-rand lib-unknown-types \
                     lib-unknown-sys lib-unknown-hash lib-unknown-encoding \
                     lib-unknown-compiletest lib-unknown; do
            cargo package -p "$pkg" --locked --no-verify --list >/dev/null
          done

  publish-crates:
    needs: test-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish workspace crates in dependency order
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          CRATES=(
            lib-unknown-polymorphism
            lib-unknown-seed
            lib-unknown-lazy
            lib-unknown-errors
            lib-unknown-hide
            lib-unknown-crypto
            lib-unknown-rand
            lib-unknown-types
            lib-unknown-sys
            lib-unknown-hash
            lib-unknown-encoding
            lib-unknown-compiletest
            lib-unknown
          )
          for pkg in "${CRATES[@]}"; do
            echo "::group::publish $pkg $VER"
            if cargo info "${pkg}@${VER}" >/dev/null 2>&1; then
              echo "$pkg $VER already published, skipping"
            else
              ok=0
              for attempt in 1 2 3 4 5; do
                if cargo publish -p "$pkg" --locked; then
                  ok=1
                  break
                fi
                echo "publish $pkg failed (attempt $attempt); waiting for registry propagation"
                sleep 30
              done
              if [ "$ok" != "1" ]; then
                echo "::error::Failed to publish $pkg $VER"
                exit 1
              fi
            fi
            echo "::endgroup::"
            sleep 15
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  create-release:
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]:/ || /^---[[:space:]]*$/) { exit }
            found { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
              for (i = start; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "Using CHANGELOG entry for $VERSION"
          else
            echo "::warning::CHANGELOG.md has no entry for $VERSION, falling back to Full Changelog"
            if [ -n "$PREV_TAG" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV_TAG" "$GITHUB_REF_NAME" > release-notes.md
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
            fi
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
