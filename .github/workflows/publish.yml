name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG cargo=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG != Cargo.toml version $VER"
            exit 1
          fi

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test all features
        run: cargo test --all-features --locked

      - name: Doctest
        run: cargo test --doc --all-features --locked

      - name: Doc build (deny warnings)
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  publish-crates:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Dry run
        run: cargo publish --locked --all-features --dry-run

      - name: Publish
        run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  create-release:
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]:/ || /^---[[:space:]]*$/) { exit }
            found { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
              for (i = start; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "Using CHANGELOG entry for $VERSION"
          else
            echo "::warning::CHANGELOG.md has no entry for $VERSION, falling back to Full Changelog"
            if [ -n "$PREV_TAG" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV_TAG" "$GITHUB_REF_NAME" > release-notes.md
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
            fi
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
